[package]
name = "sequence-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sequence"
path = "src/main.rs"

[features]
default = ["burn"]
burn = ["dep:burn", "sequence-agent/burn", "sequence-training/burn"]

[dependencies]
sequence-core.workspace = true
sequence-agent.workspace = true
sequence-runner.workspace = true
sequence-training = { path = "../../crates/sequence-training" }
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
burn = { workspace = true, optional = true }
clap = { version = "4.6", features = ["derive"] }
toml = "1.1"
anyhow = "1"
tiny_http = "0.12"
sha2 = "0.10.9"

tempfile = "3"
