algorithm = "mc"
id = "mc-balanced-v1"
name = "Monte Carlo agent — opponent-balanced samples"
device = "cuda:0"

[training]
iterations = 100
games_per_iteration = 128
batch_size = 128
inference_batch_games = 128
learning_rate = 0.0003
epsilon_start = 0.3
epsilon_end = 0.05
seed = 42
evaluation_interval = 10
evaluation_games = 100
sampling = "opponent_mix"
updates_per_iteration = 64

[training.opponents]
self_play = 40
best_checkpoint = 20
previous_checkpoint = 15
random_checkpoint = 15
greedy = 10
