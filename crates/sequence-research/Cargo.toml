[package]
name = "sequence-research"
version = "0.1.0"
edition.workspace = true

[features]
cuda = ["burn/cuda"]

[dependencies]
burn = { version = "0.22.1", default-features = false, features = ["std", "flex", "optim", "rayon", "simd"] }
burn-pack = "0.22.1"
ciborium = "0.2"
clap = { version = "4.6", features = ["derive"] }
csv = "1.4"
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend"] }
rand = { version = "0.9", default-features = false, features = ["alloc"] }
rand_chacha = { version = "0.9", default-features = false, features = ["serde"] }
rayon = "1.12"
sequence-agents = { path = "../sequence-agents" }
sequence-game = { path = "../sequence-game" }
sequence-match = { path = "../sequence-match" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
statrs = { version = "0.18", default-features = false }
tempfile = "3"
tiny_http = "0.12"
